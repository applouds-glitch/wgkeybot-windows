name: Windows checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, "386"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install resource generator
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
      - name: Regenerate icons and Windows resources
        run: |
          go run ./cmd/genico
          GOARCH=${{ matrix.goarch }} "$(go env GOPATH)/bin/goversioninfo" -o rsrc_windows.syso versioninfo.json
      - name: Build with release flags
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -H windowsgui -X github.com/wgkeybot/windows/tray.Version=ci" -o wgkeybot.exe .

  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, "386"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test native UI and portable packages
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go test -timeout 3m ./tray ./assets ./pkg/...
