name: Windows checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, "386"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install resource generator
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
      - name: Regenerate icons and Windows resources
        run: |
          go run ./cmd/genico
          GOARCH=${{ matrix.goarch }} "$(go env GOPATH)/bin/goversioninfo" -o rsrc_windows.syso versioninfo.json
      - name: Build with release flags
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -H windowsgui -X github.com/wgkeybot/windows/tray.Version=ci" -o wgkeybot.exe .

  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, "386"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test native UI and portable packages
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: pwsh
        run: |
          go test -json -timeout 8m ./tray ./assets ./pkg/... > test-results.jsonl
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $failures = Get-Content test-results.jsonl |
              Where-Object { $_ -match '"Action":"fail"' } |
              ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object { $_.Test } |
              Select-Object -ExpandProperty Test -Unique
            foreach ($test in $failures) {
              Write-Output "::error title=Windows test failed::$test"
            }
            $failedTests = @{}
            foreach ($test in $failures) { $failedTests[$test] = $true }
            Get-Content test-results.jsonl |
              Where-Object { $_ -match '_test\.go:[0-9]+:' } |
              ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object { $_.Test -and $failedTests.ContainsKey($_.Test) } |
              ForEach-Object { $_.Output.Trim() } |
              Select-Object -Unique -First 20 |
              ForEach-Object { Write-Output "::error title=Test assertion::$_" }
            if (-not $failures) {
              Write-Output "::error title=Go test failed::See test step log"
            }
            exit $testExit
          }
          Get-Content test-results.jsonl |
            Where-Object { $_ -match '"Action":"pass"' -and $_ -notmatch '"Test"' } |
            ForEach-Object { $_ | ConvertFrom-Json } |
            ForEach-Object { Write-Output "Passed $($_.Package)" }
